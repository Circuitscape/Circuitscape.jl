name: CI
env:
  JULIA_NUM_THREADS: 4
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags: '*'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Core dependencies only: CG+AMG and CHOLMOD in both precisions, native
  # .asc I/O; GeoTIFF fixtures are skipped. Julia 1 on Ubuntu is not listed
  # here because the Ubuntu extension job below runs the same suite plus more.
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - core - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1'
            os: windows-latest
          - version: 'min'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        with:
          # A job that fails partway through can leave the depot with a
          # package resolved but not installed; saving that depot poisons
          # every later run on the same ref (seen on #508, Windows).
          save-always: false
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false

  # Extensions, each exercised once: Pardiso needs MKL (x86), Accelerate needs
  # macOS, GDAL runs alongside both so the GeoTIFF fixtures are covered. The
  # Ubuntu job is the Julia 1 Ubuntu run of the core suite too, and the only
  # job that reports coverage, since it reaches the most code. The macOS job
  # skips the core solver suites: they are platform-independent and already
  # covered.
  test-extensions:
    name: Julia 1 - ${{ matrix.os }} - core + ${{ matrix.label }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packages: '"Pardiso", "ArchGDAL"'
            label: Pardiso, GDAL
            coverage: true
            core_solvers: true
          - os: macOS-latest
            packages: '"AppleAccelerate", "ArchGDAL"'
            label: Accelerate, GDAL
            coverage: false
            core_solvers: false
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          # A job that fails partway through can leave the depot with a
          # package resolved but not installed; saving that depot poisons
          # every later run on the same ref (seen on #508, Windows).
          save-always: false
      - run: |
          julia --project -e '
            using Pkg
            Pkg.add([${{ matrix.packages }}])
            Pkg.test(coverage=${{ matrix.coverage }})'
        env:
          CIRCUITSCAPE_TEST_CORE_SOLVERS: ${{ matrix.core_solvers }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
      - uses: codecov/codecov-action@v7
        if: matrix.coverage
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          # A job that fails partway through can leave the depot with a
          # package resolved but not installed; saving that depot poisons
          # every later run on the same ref (seen on #508, Windows).
          save-always: false
      - run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Install PDF dependencies
        run: pip install Pygments
      - name: Build PDF
        run: julia --project=docs docs/make_pdf.jl
      - name: Build and deploy HTML docs
        run: |
          cp docs/build/Circuitscape.jl.pdf docs/src/assets/
          julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
