name: CI
env:
  JULIA_NUM_THREADS: 4
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags: '*'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Fast path: core dependencies only. CG+AMG and CHOLMOD in both precisions,
  # native .asc I/O; GeoTIFF fixtures are skipped.
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - core - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
          - windows-latest
        include:
          - version: 'min'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        with:
          # A job that fails partway through can leave the depot with a
          # package resolved but not installed; saving that depot poisons
          # every later run on the same ref (seen on #508, Windows).
          save-always: false
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  # Extensions, each exercised once: Pardiso needs MKL (x86), Accelerate needs
  # macOS, GDAL runs alongside both so the GeoTIFF fixtures are covered.
  test-extensions:
    name: Julia 1 - ${{ matrix.os }} - core + ${{ matrix.label }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packages: '"Pardiso", "ArchGDAL"'
            label: Pardiso, GDAL
          - os: macOS-latest
            packages: '"AppleAccelerate", "ArchGDAL"'
            label: Accelerate, GDAL
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          # A job that fails partway through can leave the depot with a
          # package resolved but not installed; saving that depot poisons
          # every later run on the same ref (seen on #508, Windows).
          save-always: false
      - run: |
          julia --project -e '
            using Pkg
            Pkg.add([${{ matrix.packages }}])
            Pkg.test(coverage=true)'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          # A job that fails partway through can leave the depot with a
          # package resolved but not installed; saving that depot poisons
          # every later run on the same ref (seen on #508, Windows).
          save-always: false
      - run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - run: |
          julia --project=docs -e '
            using Documenter: doctest
            using Circuitscape
            doctest(Circuitscape)'
      - name: Install PDF dependencies
        run: pip install Pygments
      - name: Build PDF
        run: julia --project=docs docs/make_pdf.jl
      - name: Build and deploy HTML docs
        run: |
          cp docs/build/Circuitscape.jl.pdf docs/src/assets/
          julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
